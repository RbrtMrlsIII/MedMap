name: MedMap Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export static site
        env:
          NEXT_PUBLIC_BASE_PATH: /MedMap
        run: npm run build

      - name: Verify static export payload
        run: npm run verify:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live Pages site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live landing page
        run: |
          set -euo pipefail
          url="https://RbrtMrlsIII.github.io/MedMap/"
          body="$(curl --fail --silent --show-error --location "$url")"
          printf '%s' "$body" > /tmp/medmap-pages.html
          grep -Fq 'Find a clinic that can actually take your appointment.' /tmp/medmap-pages.html
          grep -Fq 'SPATIAL CLINIC DISCOVERY' /tmp/medmap-pages.html
          if grep -Fq 'Read PRODUCT_LAW.md first' /tmp/medmap-pages.html; then
            echo 'Live Pages site is serving README content instead of the MedMap application.'
            exit 1
          fi
          echo 'Live Pages smoke verification passed.'

      - name: Fetch live clinic route
        run: |
          set -euo pipefail
          url="https://RbrtMrlsIII.github.io/MedMap/clinics/northstar/"
          body="$(curl --fail --silent --show-error --location "$url")"
          printf '%s' "$body" > /tmp/medmap-clinic.html
          grep -Fq 'Northstar Family Clinic' /tmp/medmap-clinic.html
          grep -Fq 'Profile' /tmp/medmap-clinic.html
          grep -Fq 'Services' /tmp/medmap-clinic.html
          grep -Fq 'Booking' /tmp/medmap-clinic.html
          grep -Fq 'About' /tmp/medmap-clinic.html
          grep -Fq 'Contact' /tmp/medmap-clinic.html
          echo 'Live clinic route smoke verification passed.'
